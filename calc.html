<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
	<style>
	* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #f4f4f4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.calculator {
    width: 300px;
    background: white;
    padding: 20px;
    border-radius: 15px;
}

.screen {
    height: 80px;
    background: black;
    color: white;
    font-size: 32px;
    display: flex;
    align-items: center;
    justify-content: end;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    height: 60px;
    border: none;
    font-size: 22px;
    border-radius: 10px;
    cursor: pointer;
}

.zero {
    grid-column: span 2;
}
</style>
</head>
<body>

<div class="calculator">

    <div class="screen" id="screen">
        0
    </div>

    <div class="buttons">
        <button>C</button>
        <button>%</button>
        <button>/</button>
        <button>*</button>

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>-</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>+</button>

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>=</button>

        <button class="zero">0</button>
        <button>.</button>
    </div>

</div>

<script>
const screen = document.getElementById("screen");
const buttons = document.querySelectorAll("button");

let expression = "";

buttons.forEach(button => {
    button.addEventListener("click", () => {
        const value = button.innerText;

        if (value === "C") {
            expression = "";
            screen.innerText = "0";
        }
        else if (value === "=") {
            try {
                expression = eval(expression);
                screen.innerText = expression;
            } catch {
                screen.innerText = "Error";
            }
        }
        else {
            expression += value;
            screen.innerText = expression;
        }
    });
});
</script>

</body>
</html>
